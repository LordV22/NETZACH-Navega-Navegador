<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#05060f">
    <meta name="referrer" content="no-referrer">
    <meta name="description" content="NETZACH Navega — Navegador PWA de nível militar. Cookies criptografados com AES-256-GCM autenticado + ofuscação multi-camada.">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NETZACH">
    <title>NETZACH Navega</title>
    <style>
        :root {
            --bg: #05060f;
            --bg2: #0a0c1c;
            --glass: rgba(15, 18, 40, 0.55);
            --glass2: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --cyan: #22d3ee;
            --cyan2: #0ea5e9;
            --violet: #8b5cf6;
            --fuchsia: #d946ef;
            --emerald: #10b981;
            --text: #e8ecff;
            --muted: #8a93b8;
            --danger: #f43f5e;
            --warn: #f59e0b;
            --neon: 0 0 8px rgba(34,211,238,.5), 0 0 20px rgba(34,211,238,.2);
            --radius: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* fundo animado futurista */
        .bg-anim {
            position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
        }
        .bg-anim::before, .bg-anim::after {
            content: ''; position: absolute; border-radius: 50%;
            filter: blur(70px); opacity: .35;
        }
        .bg-anim::before {
            width: 400px; height: 400px; background: radial-gradient(circle, var(--cyan), transparent 70%);
            top: -100px; left: -80px; animation: drift1 16s ease-in-out infinite;
        }
        .bg-anim::after {
            width: 500px; height: 500px; background: radial-gradient(circle, var(--fuchsia), transparent 70%);
            bottom: -150px; right: -100px; animation: drift2 20s ease-in-out infinite;
        }
        .bg-anim .grid {
            position: absolute; inset: 0;
            background:
                linear-gradient(rgba(34,211,238,.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34,211,238,.05) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
        }
        @keyframes drift1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(60px,40px)} }
        @keyframes drift2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-60px,-40px)} }

        .browser, .startup { position: relative; z-index: 2; }

        .browser { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 10px; }
        .browser-inner {
            flex: 1; display: flex; flex-direction: column; min-height: 0;
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: var(--radius); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.5);
        }

        .toolbar {
            background: linear-gradient(180deg, rgba(20,24,50,.7), rgba(12,14,32,.7));
            border-bottom: 1px solid var(--glass-border);
            padding: 10px 12px; display: flex; align-items: center; gap: 8px;
            -webkit-user-select: none; user-select: none;
        }
        .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; flex-shrink: 0; letter-spacing: .3px; }
        .brand .glow { display: flex; align-items: center; gap: 6px; }
        .brand .net { color: var(--cyan); text-shadow: var(--neon); }
        .brand .nz { color: var(--violet); text-shadow: 0 0 8px rgba(139,92,246,.6); }
        .badge {
            background: linear-gradient(135deg, var(--emerald), var(--cyan));
            padding: 2px 8px; border-radius: 12px; font-size: 9px; color: #04211a; font-weight: 800; letter-spacing: .5px;
            box-shadow: 0 0 12px rgba(16,185,129,.4);
        }

        .url-bar {
            flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0;
            background: var(--glass2); border: 1px solid var(--glass-border); border-radius: 12px;
            padding: 0 12px; height: 40px;
        }
        .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
        .dot.secure { background: var(--emerald); box-shadow: 0 0 10px var(--emerald); }
        .dot.warn { background: var(--warn); box-shadow: 0 0 10px var(--warn); }
        .dot.blocked { background: var(--danger); box-shadow: 0 0 10px var(--danger); }
        .url-input {
            flex: 1; background: transparent; border: none; color: var(--text);
            font-size: 13px; outline: none; min-width: 0; caret-color: var(--cyan); font-family: inherit;
        }
        .url-input::placeholder { color: var(--muted); }

        .btn {
            background: var(--glass2); border: 1px solid transparent; color: var(--muted); cursor: pointer;
            border-radius: 10px; min-width: 38px; height: 38px; font-size: 16px; display: flex;
            align-items: center; justify-content: center; transition: all .18s; flex-shrink: 0;
        }
        .btn:hover:not(:disabled) { background: rgba(34,211,238,.12); border-color: rgba(34,211,238,.3); color: var(--cyan); box-shadow: 0 0 14px rgba(34,211,238,.2); }
        .btn:disabled { opacity: .25; cursor: not-allowed; }
        .btn.active { background: rgba(34,211,238,.2); border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 16px rgba(34,211,238,.3); }
        .btn.icon { width: auto; font-size: 12px; gap: 5px; padding: 0 12px; }

        .score {
            background: linear-gradient(135deg, rgba(16,185,129,.9), rgba(34,211,238,.9));
            color: #04211a; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 800; flex-shrink: 0;
            box-shadow: 0 0 14px rgba(16,185,129,.35);
        }

        .content { flex: 1; display: flex; min-height: 0; }
        .page { flex: 1; background: #fff; min-width: 0; }
        .frame { width: 100%; height: 100%; border: none; background: #fff; }

        .sidebar {
            width: min(360px, 88vw); background: rgba(12,14,32,.85); border-left: 1px solid var(--glass-border);
            overflow-y: auto; display: none; flex-shrink: 0; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        }
        .sidebar.open { display: block; }
        .sec { padding: 16px; border-bottom: 1px solid var(--glass-border); }
        .stitle {
            font-size: 13px; font-weight: 800; color: var(--cyan); margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center; letter-spacing: .3px;
        }
        .stitle span { color: var(--muted); font-weight: 400; font-size: 11px; }

        .cookie {
            background: var(--glass2); border: 1px solid var(--glass-border); border-radius: 12px;
            padding: 11px 12px; margin-bottom: 8px; font-size: 12px;
            border-left: 3px solid var(--violet); transition: all .18s;
        }
        .cookie:hover { border-color: rgba(139,92,246,.5); box-shadow: 0 0 12px rgba(139,92,246,.2); }
        .cookie .nm { color: var(--text); font-weight: 700; word-break: break-all; margin-bottom: 4px; }
        .cookie .nm .dom { color: var(--muted); font-weight: 400; font-size: 11px; }
        .cookie .dt { color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
        .cookie .blob { font-family: monospace; color: var(--fuchsia); word-break: break-all; margin-top: 4px; font-size: 9.5px; opacity: .8; }
        .layers { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
        .lt {
            background: rgba(139,92,246,.12); border: 1px solid rgba(139,92,246,.3); color: #c4b5fd;
            padding: 1px 6px; border-radius: 6px; font-size: 9px; font-family: monospace;
        }
        .lt.cy { background: rgba(34,211,238,.1); border-color: rgba(34,211,238,.3); color: #67e8f9; }

        .logrow { font-family: monospace; font-size: 10px; color: var(--muted); padding: 6px 0; border-bottom: 1px solid var(--glass-border); word-break: break-all; }
        .logrow .t { color: var(--violet); }
        .logrow .a { color: var(--cyan); font-weight: 700; }

        .danger {
            width: 100%; padding: 11px; border: none; border-radius: 12px; cursor: pointer;
            font-size: 13px; font-weight: 800; margin-top: 8px; background: linear-gradient(135deg, var(--danger), #be123c);
            color: #fff; box-shadow: 0 0 16px rgba(244,63,94,.3); transition: all .18s;
        }
        .danger:hover { box-shadow: 0 0 26px rgba(244,63,94,.5); }
        .langbtn {
            width: 100%; background: var(--glass2); border: 1px solid var(--glass-border); color: var(--text);
            padding: 9px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 6px; cursor: pointer; text-align: left; font-family: inherit;
        }
        .langbtn.active { border-color: var(--cyan); color: var(--cyan); background: rgba(34,211,238,.1); box-shadow: 0 0 10px rgba(34,211,238,.2); }

        .statusbar {
            background: linear-gradient(0deg, rgba(12,14,32,.8), rgba(12,14,32,.4));
            border-top: 1px solid var(--glass-border); padding: 6px 14px; display: flex; justify-content: space-between;
            font-size: 11px; color: var(--muted); align-items: center; flex-shrink: 0;
        }
        .stat-secure { color: var(--emerald); font-weight: 700; }

        /* startup */
        .startup {
            position: fixed; inset: 0; background: var(--bg); z-index: 20;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        }
        .logo-wrap {
            width: 100px; height: 100px; border-radius: 26px; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, var(--cyan2), var(--violet)); box-shadow: 0 0 60px rgba(99,102,241,.45);
            animation: float 3s ease-in-out infinite; position: relative;
        }
        .logo-wrap::after { content:''; position:absolute; inset:-4px; border-radius:30px; border:1px solid rgba(139,92,246,.5); animation: spin 6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
        .startup h1 { font-size: 26px; letter-spacing: .5px; font-weight: 800; }
        .startup h1 .n1 { color: var(--cyan); text-shadow: var(--neon); }
        .startup h1 .n2 { color: var(--violet); }
        .startup p { color: var(--muted); font-size: 13px; text-align: center; padding: 0 24px; line-height: 1.5; }
        .loader { width: 280px; height: 4px; background: var(--glass2); border-radius: 4px; overflow: hidden; position: relative; }
        .loader-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan), var(--violet), var(--fuchsia)); background-size: 200% 100%; animation: rainbow 1.5s linear infinite, load 2s ease-in-out forwards; }
        @keyframes rainbow { to { background-position: -200% 0; } }
        @keyframes load { to { width: 100%; } }
        .step { font-size: 11px; color: var(--cyan); font-family: monospace; min-height: 16px; }

        .toast {
            position: fixed; bottom: 44px; left: 50%; transform: translateX(-50%);
            background: var(--glass); color: var(--text); padding: 11px 18px; border-radius: 12px; font-size: 12px;
            box-shadow: 0 12px 40px rgba(0,0,0,.6), 0 0 20px rgba(34,211,238,.15); opacity: 0; pointer-events: none;
            transition: opacity .25s; z-index: 40; border: 1px solid var(--glass-border); border-left: 3px solid var(--cyan);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); max-width: 90vw;
        }
        .toast.show { opacity: 1; }

        /* scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(139,92,246,.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(34,211,238,.4); }

        @media (max-width: 640px) {
            .brand-text, .badge { display: none; }
            .btn.icon span.t { display: none; }
            .url-bar { padding: 0 10px; }
        }
    </style>
</head>
<body>
    <div class="bg-anim"><div class="grid"></div></div>

    <!-- STARTUP -->
    <div class="startup" id="startup" style="display:none">
        <div class="logo-wrap">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
            </svg>
        </div>
        <h1><span class="n1">NETZACH</span> <span class="n2">Navega</span></h1>
        <p id="startupMsg">Criptografando motor de sessão...</p>
        <div class="loader"><div class="loader-fill"></div></div>
        <div class="step" id="step">Inicializando AES-256-GCM autenticado</div>
    </div>

    <!-- BROWSER -->
    <div class="browser" id="browser" style="display:none">
        <div class="browser-inner">
            <div class="toolbar">
                <div class="brand">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
                    </svg>
                    <span class="glow brand-text"><span class="net">NETZACH</span> <span class="nz">Navega</span></span>
                    <span class="badge">SECURE</span>
                </div>

                <button class="btn" id="btnBack" disabled title="Voltar">←</button>
                <button class="btn" id="btnFwd" disabled title="Avançar">→</button>
                <button class="btn" id="btnReload" title="Recarregar">⟳</button>

                <div class="url-bar">
                    <span class="dot secure" id="secDot"></span>
                    <input class="url-input" id="urlInput" placeholder="Digite uma URL ou busca..." autocomplete="off" spellcheck="false" inputmode="url">
                </div>

                <button class="btn icon" id="btnLanguage" title="Idioma">🌐</button>
                <button class="btn icon" id="btnIncognito" title="Incógnito">👁️</button>
                <button class="btn icon" id="btnVault" title="Cofre de Cookies">🍪</button>
                <span class="score" id="score">100%</span>
            </div>

            <div class="content">
                <div class="page">
                    <iframe id="frame" class="frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals" referrerpolicy="no-referrer"></iframe>
                </div>

                <div class="sidebar" id="sidebar">
                    <div class="sec">
                        <div class="stitle">🍪 Cofre de Cookies&nbsp;<span id="cookieCount">0 armazenados</span></div>
                        <div id="cookieList"></div>
                        <button class="danger" id="btnClear">🧹 Limpar todos os cookies</button>
                    </div>
                    <div class="sec">
                        <div class="stitle">📜 Log de Segurança</div>
                        <div id="logList"></div>
                    </div>
                    <div class="sec">
                        <div class="stitle">🌐 Idioma</div>
                        <div id="langPicker" style="display:flex;flex-direction:column;gap:6px"></div>
                    </div>
                </div>
            </div>

            <div class="statusbar">
                <span id="status">Pronto</span>
                <span class="stat-secure" id="secStatus">🛡️ AES-256-GCM Autenticado</span>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
